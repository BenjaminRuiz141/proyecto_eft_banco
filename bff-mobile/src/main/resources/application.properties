spring.application.name=bff-mobile
server.port=8082

spring.config.import=optional:configserver:http://localhost:8888

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents,metrics
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

resilience4j.circuitbreaker.instances.notificacionMobileService.sliding-window-size=4
resilience4j.circuitbreaker.instances.notificacionMobileService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notificacionMobileService.wait-duration-in-open-state=8s
resilience4j.circuitbreaker.instances.notificacionMobileService.register-health-indicator=true

spring.datasource.url=jdbc:mysql://localhost:3306/banco_xyz_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=MyDUOCSQL004!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SSL desactivado para compatibilidad nativa con Eureka Service Discovery
server.ssl.enabled=false

